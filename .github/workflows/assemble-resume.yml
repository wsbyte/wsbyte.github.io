name: 添加最新版 PDF 简历

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/assemble-resume.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 合成并提交 PDF
        shell: bash
        run: |
          cat .tmp-resume-part-* | base64 --decode > resume.pdf
          test "$(wc -c < resume.pdf | tr -d ' ')" = "1141192"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git rm .tmp-resume-part-* .github/workflows/assemble-resume.yml
          git commit -m "添加最新版 PDF 简历"
          git push
