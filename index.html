<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>投递版简历</title>
    <style>
      :root {
        --canvas: #eee9df;
        --paper: #fffdf8;
        --paper-soft: #fbf7ee;
        --ink: #292722;
        --body: #5c5952;
        --muted: #817c72;
        --line: #dfd6c7;
        --line-soft: #eee8dc;
        --accent: #b77a1d;
        --accent-deep: #80510e;
        --accent-wash: #f7ead0;
        --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--canvas);
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--body);
        background:
          radial-gradient(circle at 12% 2%, rgba(199, 145, 54, 0.16), transparent 28rem),
          var(--canvas);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.68;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
      }

      .print-button {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 10;
        align-items: baseline;
        min-height: 34px;
        padding: 0 16px;
        color: #fffdf8;
        background: var(--accent-deep);
        border: 1px solid rgba(255, 253, 248, 0.72);
        border-radius: 3px;
        box-shadow: 0 8px 24px rgba(75, 59, 31, 0.18);
        cursor: pointer;
      }

      .print-button:hover {
        background: #694009;
      }

      .document {
        display: grid;
        gap: 24px;
        padding: 24px 0 48px;
      }

      .sheet {
        position: relative;
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 22px 68px rgba(77, 60, 31, 0.14);
      }

      .sheet::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 46mm;
        height: 2.2mm;
        content: "";
        background: var(--accent);
      }

      .sheet-inner {
        padding: 13mm 14mm 12mm;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 62mm;
        gap: 12mm;
        padding-bottom: 4mm;
      }

      .eyebrow {
        margin-bottom: 3mm;
        color: var(--accent-deep);
        font-size: 7.8pt;
        font-weight: 700;
        letter-spacing: 0.15em;
      }

      h1 {
        margin-bottom: 2mm;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 30pt;
        line-height: 1;
        letter-spacing: 0.03em;
      }

      .role {
        margin-bottom: 0;
        color: var(--body);
        font-size: 11.2pt;
        font-weight: 600;
      }

      .contact-panel {
        align-self: end;
        padding-left: 5mm;
        border-left: 1px solid var(--line);
      }

      .contact-list,
      .meta-list,
      .keyword-list,
      .tech-list,
      .bullet-list,
      .education-list,
      .highlight-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .contact-list,
      .meta-list {
        display: grid;
        gap: 1.2mm;
      }

      .contact-list li,
      .meta-list li {
        color: var(--muted);
        font-size: 8.5pt;
        line-height: 1.45;
      }

      .meta-list {
        margin-top: 2.5mm;
        padding-top: 2.5mm;
        border-top: 1px solid var(--line-soft);
      }

      .keyword-list {
        display: flex;
        flex-wrap: wrap;
        gap: 1.8mm 4mm;
        margin-top: 5mm;
      }

      .keyword-list li {
        position: relative;
        padding-left: 2.8mm;
        color: #68635a;
        font-size: 8.3pt;
        white-space: nowrap;
      }

      .keyword-list li::before {
        position: absolute;
        top: 50%;
        left: 0;
        width: 1.2mm;
        height: 1.2mm;
        content: "";
        background: var(--accent);
        transform: translateY(-50%) rotate(45deg);
      }

      .section {
        margin-top: 7mm;
      }

      .section-heading {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3mm;
        align-items: center;
        margin-bottom: 4mm;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 13pt;
        line-height: 1.2;
      }

      .section-heading::after {
        height: 1px;
        content: "";
        background: var(--line);
      }

      .summary {
        margin-bottom: 0;
        color: var(--body);
        font-size: 9.8pt;
        line-height: 1.72;
      }

      .capability-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .capability {
        padding: 3.4mm 3.8mm;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .capability h3 {
        margin-bottom: 1.2mm;
        color: var(--ink);
        font-size: 9.2pt;
        line-height: 1.4;
      }

      .capability p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 8.1pt;
        line-height: 1.6;
      }

      .work-card {
        display: grid;
        grid-template-columns: 39mm minmax(0, 1fr);
        gap: 6mm;
        padding: 4mm 0 0;
      }

      .work-meta h3 {
        margin-bottom: 1mm;
        color: var(--ink);
        font-size: 10pt;
        line-height: 1.45;
      }

      .period,
      .category {
        color: var(--accent-deep);
        font-family: Georgia, var(--sans);
        font-size: 8.1pt;
      }

      .bullet-list {
        display: grid;
        gap: 1.7mm;
      }

      .bullet-list li {
        position: relative;
        padding-left: 3.4mm;
        color: var(--body);
        font-size: 8.75pt;
        line-height: 1.62;
      }

      .bullet-list li::before {
        position: absolute;
        top: 0.72em;
        left: 0;
        width: 1.2mm;
        height: 1px;
        content: "";
        background: var(--accent);
      }

      .profile-footer {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8mm;
        margin-top: 7mm;
        padding-top: 5mm;
        border-top: 1px solid var(--line);
      }

      .mini-title {
        margin-bottom: 2.5mm;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 10.2pt;
      }

      .education-list,
      .highlight-list {
        display: grid;
        gap: 2mm;
      }

      .education-list li,
      .highlight-list li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4mm;
        color: var(--muted);
        font-size: 8.2pt;
      }

      .education-list strong,
      .highlight-list strong {
        color: var(--body);
        font-weight: 650;
      }

      .page-intro {
        padding-bottom: 5mm;
        border-bottom: 1px solid var(--line);
      }

      .page-intro h2 {
        margin-bottom: 0;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 21pt;
        line-height: 1.15;
      }

      .ai-projects {
        display: grid;
        gap: 6mm;
        margin-top: 7mm;
      }

      .project-card {
        padding: 5.6mm 6mm;
        background: linear-gradient(135deg, var(--paper-soft), #fffdf8 72%);
        border: 1px solid var(--line);
      }

      .project-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 5mm;
        align-items: start;
      }

      .project-head h3 {
        margin-bottom: 1mm;
        color: var(--ink);
        font-size: 11.6pt;
        line-height: 1.35;
      }

      .project-role {
        margin-bottom: 0;
        color: var(--accent-deep);
        font-size: 12.9pt;
      }

      .project-period {
        color: var(--muted);
        font-family: Georgia, var(--sans);
        font-size: 8.1pt;
        white-space: nowrap;
      }

      .project-description {
        margin: 3mm 0;
        color: var(--muted);
        font-size: 8.55pt;
        line-height: 1.56;
      }

      .tech-list {
        display: flex;
        flex-wrap: wrap;
        gap: 1.4mm 3mm;
        margin-bottom: 3.5mm;
        padding: 2.4mm 0;
        border-top: 1px solid var(--line-soft);
        border-bottom: 1px solid var(--line-soft);
      }

      .tech-list li {
        color: #766d5f;
        font-size: 7.5pt;
        line-height: 1.35;
      }

      .tech-list li + li::before {
        margin-right: 3mm;
        color: #ccb98f;
        content: "/";
      }

      .project-card .bullet-list li {
        font-size: 8.75pt;
        line-height: 1.58;
      }

      .project-card .project-description {
        display: block;
      }

      .platform-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3mm;
        margin-top: 5mm;
      }

      .compact-project {
        padding: 3mm 3.5mm;
        border-top: 1.2mm solid var(--accent-wash);
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .compact-project.wide {
        grid-column: 1 / -1;
      }

      .compact-project .project-head h3 {
        font-size: 13.8pt;
      }

      .compact-project .project-role,
      .compact-project .project-period {
        font-size: 11.7pt;
      }

      .compact-project .project-description {
        display: none;
      }

      .compact-project .tech-list {
        display: none;
      }

      .compact-project .tech-list li {
        font-size: 10.8pt;
      }

      .compact-project .bullet-list {
        gap: 1.1mm;
      }

      .compact-project .bullet-list li {
        font-size: 12.6pt;
        line-height: 1.45;
      }

      .sheet:nth-child(1) .section {
        margin-top: 5mm;
      }

      .sheet:nth-child(n + 2) .sheet-inner {
        display: flex;
        min-height: 297mm;
        flex-direction: column;
      }

      .sheet:nth-child(2) .ai-projects,
      .sheet:nth-child(3) .ai-projects,
      .sheet:nth-child(4) .ai-projects {
        flex: 1;
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      .sheet:nth-child(2) .project-card,
      .sheet:nth-child(3) .project-card,
      .sheet:nth-child(4) .project-card {
        display: flex;
        flex-direction: column;
      }

      .sheet:nth-child(2) .project-card .bullet-list,
      .sheet:nth-child(3) .project-card .bullet-list,
      .sheet:nth-child(4) .project-card .bullet-list {
        flex: 1;
        align-content: space-between;
      }

      .sheet:nth-child(5) .profile-footer {
        margin-top: 5mm;
        padding-top: 4mm;
      }

      code {
        padding: 0;
        color: inherit;
        background: transparent;
        font-family: inherit;
        font-size: inherit;
      }

      strong {
        color: var(--ink);
        font-weight: 650;
      }

      @media screen and (max-width: 860px) {
        .print-button {
          right: 12px;
          bottom: 12px;
        }

        .document {
          gap: 12px;
          padding-bottom: 18px;
        }

        .sheet {
          width: 100%;
          min-height: auto;
          box-shadow: none;
        }

        .sheet-inner {
          padding: 34px 22px 42px;
        }

        .sheet:nth-child(n + 2) .sheet-inner {
          display: block;
          min-height: auto;
        }

        .sheet:nth-child(2) .ai-projects,
        .sheet:nth-child(3) .ai-projects,
        .sheet:nth-child(4) .ai-projects {
          grid-template-rows: none;
        }

        .hero,
        .work-card,
        .profile-footer,
        .platform-grid {
          grid-template-columns: 1fr;
        }

        .contact-panel {
          padding: 18px 0 0;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .capability-grid {
          grid-template-columns: 1fr;
        }

        .compact-project.wide {
          grid-column: auto;
        }

        .project-head {
          grid-template-columns: 1fr;
          gap: 3px;
        }
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }

        html,
        body {
          margin: 0;
          padding: 0;
          background: #fff;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .print-button {
          display: none !important;
        }

        .document {
          display: block;
          padding: 0;
        }

        .sheet {
          width: 210mm;
          height: 297mm;
          min-height: 297mm;
          margin: 0;
          overflow: hidden;
          box-shadow: none;
          break-after: page;
          page-break-after: always;
        }

        .sheet:last-child {
          break-after: auto;
          page-break-after: auto;
        }
      }
    </style>
  </head>

          <footer class="profile-footer">
            <section>
              <h2 class="mini-title">教育经历</h2>
              <ul id="education" class="education-list"></ul>
            </section>
            <section>
              <h2 class="mini-title">其他亮点</h2>
              <ul id="highlights" class="highlight-list"></ul>
            </section>
          </footer>
        </div>
      </section>

            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        }

            return projectCard(rule, false);
          }).join("");
          document.getElementById("devopsProjects").innerHTML = devopsRules.map(function (rule) {
            return projectCard(rule, false);
          }).join("");
          document.getElementById("serviceProjects").innerHTML = serviceRules.map(function (rule) {
            return projectCard(rule, false);
          }).join("");
          document.getElementById("middlewareProjects").innerHTML = middlewareRules.map(function (rule) {
            return projectCard(rule, false);
          }).join("");
        }

        renderIdentity();
        renderProfile();
        renderProjects();

        document.getElementById("printResume").addEventListener("click", function () {
          window.print();
        });
      })();
    </script>
  </body>
</html>
